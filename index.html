 return u.words.map((w,index)=>({w,index})).filter(x=>!Array.isArray(selected)||selected.includes(x.w.keyword));
}
function scoreFor(type,item,index=0){
 const scores=scoresFor(type);
 return Number(scores[item?.id]??scores[item?.index]??scores[index]??0);
}
function saveScore(type,item,index,score){
 const scores=scoresFor(type);
 scores[item.id]=Math.max(Number(scores[item.id]??scores[item.index]??scores[index]??0),score);
 update(route.u,type+'Scores',scores);
 return scores;
}
function wordAudioMarkup(text){
 return String(text??'').split(/(\s+)/).map(part=>{
  if(/^\s+$/.test(part))return esc(part);
  const spoken=part.replace(/^[^A-Za-z]+|[^A-Za-z']+$/g,'');
  return spoken?`<button type="button" class="word-audio" data-speak="${esc(spoken)}" aria-label="Nghe từ ${esc(spoken)}">${esc(part)}</button>`:esc(part);
 }).join('');
}

 $('#work').innerHTML=`<p class="eyebrow">BƯỚC 02 / 04 · HỌC HIỂU TRƯỚC KHI LUYỆN</p><h2>Hiểu từ. Đọc câu. Rồi tự dịch.</h2><p class="instructions">Toàn bộ câu mẫu được hiển thị sẵn. Đọc nghĩa, bấm vào từng từ tiếng Anh để nghe riêng, nghe cả câu rồi mới bắt đầu luyện dịch.</p><div class="learning-tabs"><button class="btn" id="study-tab">1 · Học liệu & lý thuyết</button><button class="btn light" id="practice-tab">2 · Bắt đầu luyện dịch</button></div>${u.translations.map(t=>`<section class="study-card"><p class="eyebrow">${esc(t.sound)}</p><h2>${esc(t.title)}</h2>${t.cards.map(c=>`<article class="study-card"><h3>${esc(c.vocab)}</h3>${[[c.eng1,c.vie1],[c.eng2,c.vie2]].map(([en,vi])=>`<div class="study-sentence"><p class="en word-audio-line">${wordAudioMarkup(en)}</p><p class="vi">${esc(vi)}</p><button class="btn light mt" data-speak="${esc(en)}">Nghe cả câu</button></div>`).join('')}</article>`).join('')}<article class="study-card"><h3>Đoạn văn đầy đủ</h3><p class="study-sentence en word-audio-line">${wordAudioMarkup(t.fullEng)}</p><p class="study-sentence vi">${esc(t.fullVie)}</p><button class="btn light" data-speak="${esc(t.fullEng)}">Nghe cả đoạn văn</button></article></section>`).join('')}<section class="theory-panel"><h2>Cách học & vận dụng</h2><p>① Đọc từ và nghĩa tiếng Việt. Bấm vào từ tiếng Anh để nghe riêng, hoặc nghe cả câu.</p><p>② Chú ý cách từ xuất hiện trong câu: ai làm gì, với ai, ở đâu hoặc khi nào. Dùng câu gốc làm mẫu.</p><p>③ Đọc đoạn văn song ngữ để hiểu ngữ cảnh. Sau đó tự dịch từng câu ở phần luyện tập.</p><p>④ Nếu chưa nhớ, dùng nghĩa từ, gợi ý từ đầu hoặc cấu trúc câu. Đối chiếu câu mẫu sau khi tự làm.</p><p class="small">Học liệu gốc được giữ nguyên. Bạn có thể chọn những câu cần luyện trong buổi học; các câu còn lại vẫn được hiển thị để đọc trước.</p>${selectionPanel(u,'translation',allExerciseItems(u,'translation'))}<label class="field"><input id="theory-read" type="checkbox" ${theoryRead?'checked':''}> Tôi đã xem qua học liệu (không bắt buộc).</label><button class="btn mt" id="start-practice">Bắt đầu luyện dịch →</button></section>`;
 bindSpeak();bindSelectionPanel(u,'translation',allExerciseItems(u,'translation'),1,()=>translationView());
 $('#theory-read').onchange=e=>{update(u.id,'translationTheory',e.target.checked)};
 const start=()=>{state.positions[studyKey()]='practice';save();translationView();$('#work').scrollIntoView({behavior:'smooth',block:'start'})};
 $('#start-practice').onclick=start;$('#practice-tab').onclick=start;stageNavigation();
}
const accountSettings=settingsPage;
settingsPage=function(){accountSettings();bindPortableControls();const row=root.querySelector('.heading');row.insertAdjacentHTML('afterend','<div class="sync-status" id="settings-sync">Hồ sơ được đồng bộ theo tài khoản. Chỉ tắt trang sau khi trạng thái báo đã lưu.</div>');if(!isTeacher()){$('#import')?.closest('section')?.querySelector('label[for="import"]')?.remove();$('#import')?.remove()}let legacy;try{legacy=JSON.parse(localStorage.getItem('bob_academy_v1')||'null')}catch{}if(isTeacher()&&legacy?.version===1){const recover=document.createElement('button');recover.className='btn light mt';recover.textContent='Chuyển tiến độ phiên bản cũ sang tài khoản này';recover.onclick=()=>{if(!confirm('Thay tiến độ tài khoản hiện tại bằng tiến độ phiên bản cũ trên thiết bị này?'))return;state={...legacy,positions:legacy.positions||{},accessMode:'explore'};save();render();toast('Đã khôi phục. Đang đồng bộ vào tài khoản giáo viên.')};row.after(recover)}if(window.bobRecovery){const b=document.createElement('button');b.className='btn light';b.textContent='Tải bản nháp cũ trên thiết bị';b.onclick=()=>downloadJson(window.bobRecovery,'bob-ban-nhap-cu.json');row.after(b)}};
function downloadJson(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function teacherPage(){if(!isTeacher()){go('home');return}layout(`${heading('Quản lý lớp học','Tạo tài khoản học viên, theo dõi tiến độ và cập nhật học liệu.','KHÔNG GIAN GIÁO VIÊN')}<div class="notice">Bạn tạo tài khoản, gửi tên đăng nhập và mật khẩu cho học viên. Học viên không cần email hay tài khoản ChatGPT. Kho học liệu gốc chỉ dành cho giáo viên.</div><div class="plan-grid"><section class="card"><h2>Tạo tài khoản học viên</h2><form id="enroll-form" class="teacher-form"><label class="field" for="student-name">Tên học viên</label><input id="student-name" maxlength="100" required autocomplete="off"><label class="field" for="student-username">Tên đăng nhập</label><input id="student-username" required pattern="[a-z0-9_.-]{3,32}" minlength="3" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ví dụ: an01"><label class="field" for="student-password">Mật khẩu cấp cho học viên</label><input id="student-password" type="password" required minlength="3" maxlength="128" autocomplete="new-password"><label class="small"><input type="checkbox" id="student-show-password"> Hiện mật khẩu</label><button class="btn" type="submit">Tạo tài khoản</button><div id="enroll-result" aria-live="polite"></div></form></section><section class="card"><h2>Học liệu của giáo viên</h2><p>Xem toàn bộ bản gốc hoặc sửa câu, nghĩa và từ vựng theo bài. Học viên chỉ được nhận nội dung mở theo tiến độ.</p><button class="btn light" data-go="resources">Mở kho học liệu</button><button class="btn light mt" id="course-export">Xuất học liệu (.json)</button><label class="field" for="course-import">Cập nhật từ file học liệu đã sửa</label><input id="course-import" type="file" accept=".json,application/json"><p class="small">Giữ đủ cấu trúc 44 âm / 23 bài dịch để tránh lệch tiến độ. Hệ thống kiểm tra cấu trúc trước khi lưu.</p><div id="course-result" aria-live="polite"></div></section></div><section class="panel"><h2>Học viên & tiến độ riêng</h2><div id="student-list">Đang tải danh sách…</div></section><section class="panel teacher-course-editor"><h2>Chỉnh câu và nghĩa trong bài dịch</h2><label class="field" for="teacher-lesson">Chọn bài</label><select id="teacher-lesson">${data.translations.map((t,i)=>`<option value="${i}">${esc(t.title)}</option>`).join('')}</select><label class="field" for="teacher-card">Chọn thẻ từ</label><select id="teacher-card">${Array.from({length:8},(_,i)=>`<option value="${i}">Thẻ ${i+1}</option>`).join('')}</select><div id="edit-fields"></div><button class="btn mt" id="save-card">Lưu cập nhật học liệu</button><div id="edit-result" aria-live="polite"></div><p class="small mt">Việc sửa câu không xóa bài làm cũ. Học viên đối chiếu câu mới ở những lần luyện tiếp theo.</p></section>`);bindExtras();
 const refresh=async()=>{try{const r=await api('/api/teacher',{cache:'no-store'}),result=await r.json();if(!r.ok)throw Error(result.error);$('#student-list').innerHTML=result.students.length?result.students.map((s,i)=>`<article class="student-row"><h3>${esc(s.name)}</h3><p>${esc(s.username)} · ${s.active?'Đang học':'Đã tạm ngưng'}</p><p>${s.steps}/56 bước · ${Math.round(s.steps/56*100)}% khóa học</p><div class="progress"><i style="width:${s.steps/56*100}%"></i></div><p class="small mt">Lần lưu gần nhất: ${s.updatedAt?new Date(s.updatedAt).toLocaleString('vi-VN'):'Chưa có bài làm'}</p><details><summary>Tiến độ từng bài</summary><div class="table-wrap"><table><thead><tr><th>Bài</th>${stepNames.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${units.map(u=>`<tr><td>${u.week}</td>${[0,1,2,3].map(n=>`<td>${s.progress[u.id]?.['stage'+n]?'✓':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><div class="reset-password mt"><label class="field" for="reset-password-${i}">Mật khẩu mới (nếu cần đặt lại)</label><input type="password" id="reset-password-${i}" minlength="3" maxlength="128" autocomplete="new-password"><button class="btn light mt" data-reset-student="${i}">Đặt lại mật khẩu</button></div><button class="btn light mt" data-toggle-student="${i}">${s.active?'Tạm ngưng quyền học':'Mở lại quyền học'}</button></article>`).join(''):'<p class="mt">Chưa có học viên. Thêm tên, tài khoản và mật khẩu ở phía trên.</p>';root.querySelectorAll('[data-reset-student]').forEach(b=>b.onclick=async()=>{const i=Number(b.dataset.resetStudent),student=result.students[i],password=$('#reset-password-'+i).value;if(password.length<3){toast('Nhập mật khẩu mới từ 3 ký tự.');return}b.disabled=true;try{await teacherWrite({action:'resetPassword',id:student.id,password});$('#reset-password-'+i).value='';toast('Đã đặt lại mật khẩu. Phiên đăng nhập cũ đã kết thúc.')}catch(e){toast(e.message)}finally{b.disabled=false}});root.querySelectorAll('[data-toggle-student]').forEach(b=>b.onclick=async()=>{const s=result.students[Number(b.dataset.toggleStudent)];b.disabled=true;try{await teacherWrite({action:'active',id:s.id,active:!s.active});await refresh()}catch(e){toast(e.message);b.disabled=false}})}catch(e){$('#student-list').textContent=e.message}};
 $('#student-show-password').onchange=e=>$('#student-password').type=e.target.checked?'text':'password';$('#enroll-form').onsubmit=async e=>{e.preventDefault();const b=$('#enroll-form button');b.disabled=true;try{await teacherWrite({action:'create',username:$('#student-username').value,name:$('#student-name').value,password:$('#student-password').value});$('#enroll-result').textContent='Đã tạo tài khoản '+$('#student-username').value+'. Bạn gửi tài khoản và mật khẩu cho học viên.';$('#student-password').value='';await refresh()}catch(e){$('#enroll-result').textContent=e.message}finally{b.disabled=false}};
 $('#course-export').onclick=()=>downloadJson(data,'bob-hoc-lieu.json');$('#course-import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error('File quá lớn.');const content=JSON.parse(await f.text());if(!confirm('Cập nhật toàn bộ học liệu bằng file này? Bài làm hiện tại được giữ lại.'))return;await teacherWrite({action:'course',content});await loadCourse();$('#course-result').textContent='Đã cập nhật học liệu.'}catch(error){$('#course-result').textContent=error.message}};
 const fillEditor=()=>{const card=data.translations[Number($('#teacher-lesson').value)].cards[Number($('#teacher-card').value)];$('#edit-fields').innerHTML=[['vocab','Từ vựng & nghĩa'],['eng1','Câu tiếng Anh 1'],['vie1','Nghĩa tiếng Việt 1'],['eng2','Câu tiếng Anh 2'],['vie2','Nghĩa tiếng Việt 2']].map(([k,label])=>`<label class="field" for="edit-${k}">${label}</label><input id="edit-${k}" value="${esc(card[k])}">`).join('')};$('#teacher-lesson').onchange=fillEditor;$('#teacher-card').onchange=fillEditor;fillEditor();$('#save-card').onclick=async()=>{const b=$('#save-card');b.disabled=true;try{const next=JSON.parse(JSON.stringify(data)),card=next.translations[Number($('#teacher-lesson').value)].cards[Number($('#teacher-card').value)];const lesson=next.translations[Number($('#teacher-lesson').value)],old={...card};for(const k of ['vocab','eng1','vie1','eng2','vie2'])card[k]=$('#edit-'+k).value.trim();for(const [k,paragraph] of [['eng1','fullEng'],['eng2','fullEng'],['vie1','fullVie'],['vie2','fullVie']])if(old[k]!==card[k])lesson[paragraph]=lesson[paragraph].replace(old[k],card[k]);await teacherWrite({action:'course',content:next});await loadCourse();syncAssignmentSnapshot();$('#edit-result').textContent='Đã lưu câu và nghĩa mới.'}catch(e){$('#edit-result').textContent=e.message}finally{b.disabled=false}};await refresh();
}
async function teacherWrite(body){const r=await api('/api/teacher',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await r.json();if(!r.ok)throw Error(result.error||'Chưa lưu được thay đổi.');return result}
function readToken(){try{return sessionStorage.getItem('bob_session_token')||''}catch{return ''}}
function storeToken(token){try{sessionStorage.setItem('bob_session_token',token)}catch{throw Error('Trình duyệt đang chặn lưu phiên đăng nhập. Hãy cho phép bộ nhớ của trang web.')}}
function apiBase(){const raw=String(window.BOB_CONFIG?.API_BASE_URL||'').trim().replace(/\/+$/,'');if(!raw)throw Error('Chưa điền địa chỉ máy chủ ở đầu file index.html.');const url=new URL(raw);if(url.protocol!=='https:'&&!(url.protocol==='http:'&&['localhost','127.0.0.1'].includes(url.hostname)))throw Error('Địa chỉ máy chủ phải dùng HTTPS.');if(url.username||url.password||url.search||url.hash||url.pathname!=='/')throw Error('Điền URL gốc của Worker, không thêm đường dẫn, tên đăng nhập hay mật khẩu.');return url.origin}
async function api(path,options={}){const headers=new Headers(options.headers||{}),token=readToken();if(token)headers.set('Authorization','Bearer '+token);const response=await fetch(apiBase()+path,{...options,headers,credentials:'omit'});return response}
function showLogin(message=''){account=null;data=null;cloudPending=false;cloudConflict=false;clearTimeout(cloudTimer);let configured=true;try{apiBase()}catch{configured=false}root.innerHTML=`<main class="entry login-entry"><div class="entry-brand">b</div><p class="eyebrow">BOB ENGLISH · LỚP HỌC CỦA BẠN</p><h1>Học từng bước.<br>Tự tin mỗi ngày.</h1><p>Đăng nhập bằng tài khoản giáo viên đã cấp để tiếp tục lộ trình của bạn.</p>${!configured?'<div class="notice">Chủ website cần điền địa chỉ API ở đầu file <strong>index.html</strong> trước khi sử dụng tài khoản thật. Xem file <strong>HUONG_DAN.html</strong> trong bộ mã.</div>':''}<form id="login-form" class="teacher-form"><label class="field" for="login-username">Tên đăng nhập</label><input id="login-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="32" placeholder="Tên đăng nhập của bạn"><label class="field" for="login-password">Mật khẩu</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Mật khẩu"><label class="small"><input type="checkbox" id="login-show-password"> Hiện mật khẩu</label><button class="btn mt" id="login-submit" ${configured?'':'disabled'}>Đăng nhập →</button><p id="login-error" class="login-error" role="status" aria-live="polite">${esc(message)}</p></form><p class="small">Quên mật khẩu? Liên hệ giáo viên để được cấp lại.</p></main>`;$('#login-show-password').onchange=e=>$('#login-password').type=e.target.checked?'text':'password';$('#login-form').onsubmit=async e=>{e.preventDefault();const button=$('#login-submit'),error=$('#login-error');button.disabled=true;error.textContent='Đang đăng nhập…';try{const r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#login-username').value.trim().toLowerCase(),password:$('#login-password').value}),signal:AbortSignal.timeout(20000)});const result=await r.json();if(!r.ok)throw Error(result.error);storeToken(result.token);await bootstrap()}catch(errorValue){if(error.isConnected)error.textContent=errorValue.message==='Failed to fetch'?'Chưa kết nối được máy chủ. Kiểm tra mạng và cấu hình API.':errorValue.message}finally{if(button.isConnected)button.disabled=false}}}
async function logout(){if(account&&cloudPending){const saved=await flushCloudSave();if(!saved&&!confirm('Bài làm chưa lưu trực tuyến. Tiếp tục đăng xuất? Bản nháp vẫn nằm trên thiết bị.'))return}try{await api('/api/logout',{method:'POST'})}catch{}try{sessionStorage.removeItem('bob_session_token')}catch{}state=null;account=null;cloudRevision=0;window.bobRecovery=null;location.hash='';showLogin('Đã đăng xuất.')}
function bindPortableControls(){root.querySelectorAll('[data-logout]').forEach(b=>b.onclick=e=>{e.preventDefault();logout()});root.querySelectorAll('[data-material]').forEach(b=>b.onclick=async e=>{e.preventDefault();try{const name=b.dataset.material,r=await api('/api/materials/'+encodeURIComponent(name));if(!r.ok){const result=await r.json();throw Error(result.error)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}catch(e){toast(e.message)}})}
const portableLayout=layout;layout=function(body){portableLayout(body);bindPortableControls()};

const portableSettings=settingsPage;settingsPage=function(){portableSettings();const section=document.createElement('section');section.className='panel';section.innerHTML='<h3>Đổi mật khẩu</h3><form id="change-password" class="teacher-form"><label class="field" for="old-password">Mật khẩu hiện tại</label><input id="old-password" type="password" autocomplete="current-password" required><label class="field" for="new-password">Mật khẩu mới (từ 3 ký tự)</label><input id="new-password" type="password" minlength="3" maxlength="128" autocomplete="new-password" required><button class="btn mt">Lưu mật khẩu mới</button><div id="password-result" role="status"></div></form>';root.querySelector('.footer').before(section);$('#change-password').onsubmit=async e=>{e.preventDefault();const b=$('#change-password button');b.disabled=true;try{const r=await api('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:$('#old-password').value,newPassword:$('#new-password').value})}),result=await r.json();if(!r.ok)throw Error(result.error);$('#password-result').textContent='Đã đổi mật khẩu.';$('#change-password').reset()}catch(e){$('#password-result').textContent=e.message}finally{b.disabled=false}}};
bootstrap();
