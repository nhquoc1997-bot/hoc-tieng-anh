function pronBest(sound,word,kind){const x=state.pronScores?.[pronKey(sound,word,kind)];return x?x.best:null}

/* --- chấm điểm: thuần logic, không phụ thuộc giao diện --- */
function pronWords(t){return norm(t).replace(/'/g,'').split(' ').filter(Boolean)}
function pronLev(a,b){const m=a.length,n=b.length;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const row=[i];for(let j=1;j<=n;j++)row[j]=Math.min(row[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=row}return prev[n]}
function pronSim(a,b){if(!a||!b)return 0;if(a===b)return 1;return Math.max(0,1-pronLev(a,b)/Math.max(a.length,b.length))}
function pronAlign(tw,hw){
 // Căn từng từ mục tiêu với từ máy nghe được (quy hoạch động, thay thế có trọng số theo độ giống).
 const n=tw.length,m=hw.length,D=[],B=[];
 for(let i=0;i<=n;i++){D[i]=[];B[i]=[];for(let j=0;j<=m;j++){
  if(!i&&!j){D[i][j]=0;continue}
  let best=Infinity,op='';
  if(i&&j){const s=pronSim(tw[i-1],hw[j-1]),c=D[i-1][j-1]+(s===1?0:s>=0.5?1-s*0.6:1.2);if(c<best){best=c;op='sub'}}
  if(i&&D[i-1][j]+1<best){best=D[i-1][j]+1;op='miss'}
  if(j&&D[i][j-1]+0.6<best){best=D[i][j-1]+0.6;op='extra'}
  D[i][j]=best;B[i][j]=op}}
 const ops=[];let i=n,j=m;
 while(i||j){const op=B[i][j];
  if(op==='sub'){const s=pronSim(tw[i-1],hw[j-1]);ops.unshift({t:tw[i-1],h:hw[j-1],sim:s,type:s===1?'ok':s>=0.5?'near':'wrong'});i--;j--}
  else if(op==='miss'){ops.unshift({t:tw[i-1],h:'',sim:0,type:'miss'});i--}
  else{ops.unshift({t:'',h:hw[j-1],sim:0,type:'extra'});j--}}
 return ops;
}
function pronEnding(t,h){
 if(!t||!h||t===h)return '';
 if(/^th/.test(t)&&!/^th/.test(h)&&/^[tdfsz]/.test(h))return 'th';
 if(t.startsWith(h)&&t.length-h.length<=3)return 'drop';
 if(t.endsWith(h)&&t.length-h.length<=2)return 'first';
 if(h.length>2&&t.length>2&&t.slice(0,-1)===h.slice(0,-1))return 'final';
 if(t.slice(1)===h.slice(1))return 'first';
 const v=x=>x.replace(/[aeiouy]+/g,'*');if(v(t)===v(h))return 'vowel';

}
function scorePron(kind,target,alts){
 const tw=pronWords(target);let best=null;
 alts.slice(0,5).forEach((a,ai)=>{
  const hw=pronWords(a.t);if(!hw.length)return;
  const ops=pronAlign(tw,hw),core=ops.filter(o=>o.type!=='extra'),extra=ops.length-core.length;
  const acc=core.reduce((s,o)=>s+(o.type==='ok'?1:o.type==='near'?Math.max(0,0.5*o.sim-0.1):0),0)/Math.max(1,tw.length);
  const conf=a.c>0&&a.c<=1?a.c:0.88;
  let score=Math.round(100*(acc*0.88+(acc>0?0.12*conf:0)))-ai*(kind==='w'?15:6)-Math.min(12,extra*(kind==='w'?2:3));
  score=Math.max(0,Math.min(100,score));
  if(!best||score>best.score)best={score,ops,heard:a.t,conf,alt:ai};
 });
 return best||{score:0,ops:tw.map(t=>({t,h:'',sim:0,type:'miss'})),heard:'',conf:0,alt:0};
}
function pronVerdict(s){return s>=90?['Xuất sắc!','Phát âm rõ ràng, máy nhận ra chính xác.','good']:s>=75?['Khá tốt','Gần chuẩn rồi, chỉnh thêm vài điểm nhỏ bên dưới.','good']:s>=50?['Cần luyện thêm','Một số từ máy nghe chưa đúng. Xem lỗi và đọc lại.','mid']:['Chưa đạt','Máy chưa nhận ra từ bạn đọc. Nghe mẫu, đọc chậm và rõ hơn.','low']}
function pronIssues(res,kind,focusWord){
 const tips=[],seen=new Set();
 res.ops.forEach(o=>{
  if(o.type==='near'||o.type==='wrong'){const e=pronEnding(o.t,o.h);
   tips.push(`<li><b>${esc(o.t)}</b> → máy nghe thành “${esc(o.h)}”. ${e==='th'?'Âm <b>th</b> chưa đúng: đặt đầu lưỡi giữa hai hàm răng rồi đẩy hơi ra, đừng đọc thành “t” hay “đ”.':e==='drop'?'Bạn đang <b>nuốt âm cuối</b>: bật rõ phần cuối của từ.':e==='final'?'Âm <b>cuối từ</b> chưa đúng: kết thúc từ dứt khoát, rõ âm.':e==='first'?'Âm <b>đầu từ</b> chưa đúng: chú ý khẩu hình lúc bắt đầu.':e==='vowel'?'<b>Nguyên âm</b> chưa chuẩn: chú ý độ dài và khẩu hình miệng.':'Nghe mẫu từ này và đọc chậm từng âm.'}</li>`);
   if(e)seen.add(e)}
  else if(o.type==='miss')tips.push(`<li>Bỏ sót từ <b>${esc(o.t)}</b>: đọc đủ từng từ, kể cả từ ngắn.</li>`);
 });
 const extras=res.ops.filter(o=>o.type==='extra').map(o=>o.h);
 if(extras.length&&kind==='s')tips.push(`<li>Máy nghe thừa: “${esc(extras.slice(0,3).join(' '))}”. Có thể bạn đọc lặp hoặc có tiếng ồn.</li>`);
 if(kind==='w'&&extras.length&&res.score>=75)tips.push('<li>Chỉ đọc một từ, không thêm từ khác.</li>');

function pronResultHtml(res,kind,target,btn){

function settingsPage(){layout(`${heading('Thiết lập góc học của bạn.','Lưu thông tin học viên và giữ một bản sao tiến độ.','CÀI ĐẶT')}<div class="plan-grid"><section class="card"><h3>Hồ sơ học tập</h3><p>${esc(account?.username)} · ${isTeacher()?'Giáo viên':'Học viên'}</p><a class="btn light" href="#" data-logout>Đăng xuất</a><label class="field" for="name">Tên hiển thị</label><input id="name" type="text" maxlength="40" value="${esc(state.name)}"><label class="field" for="start">Ngày bắt đầu lộ trình</label><input id="start" type="date" value="${esc(state.start)}"><button class="btn mt" id="save-profile">Lưu thay đổi</button><p>Ngày bắt đầu dùng để tham khảo lịch. Bài được mở theo tiến độ, không theo ngày.</p></section><section class="card"><h3>Bản sao tiến độ</h3><p>Tiến độ được lưu riêng theo tài khoản trên máy chủ và tự đồng bộ khi có kết nối. Xuất bản sao để chuyển sang trình duyệt khác.</p><button class="btn" id="export">Xuất tiến độ (.json)</button><label class="field" for="import">Khôi phục từ bản sao (thay thế tiến độ hiện tại)</label><input id="import" type="file" accept="application/json,.json"><p>Bản sao chứa bài làm cá nhân; hãy giữ riêng cho mình.</p></section><section class="card"><h3>Phạm vi phiên bản hiện tại</h3><div class="details"><div><strong>Đã có</strong><span>Lộ trình tuần tự, bài tập tự học, kiểm tra theo câu mẫu, lưu bài làm, thu âm và xuất tiến độ.</span></div><div><strong>Tài khoản và khóa học</strong><span>Đã có tài khoản do giáo viên tạo và lưu tiến độ riêng trên máy chủ. Thanh toán chưa được tích hợp.</span></div></div></section><section class="card"><h3>Cách tự học hiệu quả</h3><p>Buổi 1 học IPA và dịch. Trong tuần làm 25–35 phút/ngày. Buổi 2 luyện nghe và mô tả. Hoàn thành bốn bước để mở bài mới.</p><p>Tuần 13 ôn nguyên âm. Tuần 14 ôn phụ âm và tổng kết. Speaking chuyên sâu vẫn học riêng với giáo viên.</p><button class="btn light" data-go="path">Xem lộ trình</button></section></div>`);$('#save-profile').onclick=()=>{state.name=$('#na /* --- tiến độ theo từng bước, tính được cho mọi bài --- */
function unitScores(uid,type){const v=p(uid)[type+'Scores']||{};return Array.isArray(v)?Object.fromEntries(v.map((x,i)=>[String(i),x])):v}
function ipaLearned(uid,sound,word){const c=p(uid).ipaChecks||{};return !!c[sound+':'+word]||(pronBest(sound,word,'w')??0)>=70}
function ipaStats(u){const sounds=selectedIpaSounds(u);let total=0,learned=0;const per=sounds.map(s=>{const l=s.words.filter(w=>ipaLearned(u.id,s.sound,w.word)).length;total+=s.words.length;learned+=l;return{sound:s.sound,learned:l,total:s.words.length}});return{per,total,learned,pct:total?Math.round(learned/total*100):0}}
function stagePct(uid,s){
 if(done(uid,s))return 100;const u=units[uid];if(!u||!data)return 0;
 try{
  if(s===0)return ipaStats(u).pct;
  if(s===1||s===2){const it=exerciseItems(u,s===1?'translation':'listen'),sc=unitScores(uid,s===1?'tr':'li');if(!it.length)return 0;const ok=it.filter(x=>Number(sc[x.id]??(s===2?(x.legacyListenIndex===undefined?0:sc[x.legacyListenIndex]):sc[x.index])??0)>=80).length;return Math.round(ok/it.length*100)}
  const c=p(uid).descDone||{},g=descGoal(u),d=u.words.filter((w,i)=>c[w.keyword]||c[i]).length;return g?Math.min(100,Math.round(d/g*100)):0;
 }catch{return 0}
}
function percent(u){return Math.round([0,1,2,3].reduce((a,s)=>a+stagePct(u,s),0)/4)}

/* --- ảnh minh họa: ảnh giáo viên gắn → ảnh thu nhỏ Bing (nạp thẳng, nhanh) → Openverse → chữ cái --- */
const IMG_KEY='bob_img_cache_v1',PICK_KEY='bob_img_pick_v2';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch{return{}}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function imgTerm(w){return String(w.word||w.keyword||'').trim()}
function bingThumb(q){return 'https://tse2.mm.bing.net/th?q='+encodeURIComponent(q)+'&w=640&h=400&c=7&rs=1&p=0'}
function imgCandidates(w){const own=w.image||w.img||w.imageUrl||w.picture,t=imgTerm(w).toLowerCase(),list=own?[{url:own,credit:''}]:[];if(t)['photo','','real life','illustration'].forEach(x=>list.push({url:bingThumb((t+' '+x).trim()),credit:''}));return list}
async function openverseList(w){
 const key=norm(imgTerm(w)),cache=lsGet(IMG_KEY),hit=cache[key];if(hit&&Date.now()-hit.t<30*864e5)return hit.list;
 try{const r=await fetch('https://api.openverse.org/v1/images/?q='+encodeURIComponent(imgTerm(w))+'&page_size=6&mature=false',{headers:{Accept:'application/json'},signal:AbortSignal.timeout(8000)});if(!r.ok)return[];const j=await r.json();
  const list=(j.results||[]).filter(x=>x.thumbnail||x.url).slice(0,6).map(x=>({url:x.thumbnail||x.url,credit:[x.creator,x.license?'CC '+String(x.license).toUpperCase():''].filter(Boolean).join(' · '),link:x.foreign_landing_url||''}));
  const c=lsGet(IMG_KEY);c[key]={t:Date.now(),list};const ks=Object.keys(c);if(ks.length>400)delete c[ks[0]];lsSet(IMG_KEY,c);return list}catch{return[]}
}
function prefetchWordImage(w){try{const c=imgCandidates(w);if(!c.length)return;const i=(lsGet(PICK_KEY)[norm(imgTerm(w))]||0)%c.length,im=new Image();im.decoding='async';im.referrerPolicy='no-referrer';im.src=c[i].url}catch{}}
function fillImage(box,w){
 if(!box)return;const key=norm(imgTerm(w)),list=imgCandidates(w);
 if(!list.length){box.classList.add('noimg');return}
 const start=(lsGet(PICK_KEY)[key]||0)%list.length,cr=box.querySelector('.fimg-credit'),sw=box.querySelector('.fimg-swap');
 const show=(img,it)=>{if(!box.isConnected)return;box.querySelector('img')?.remove();box.prepend(img);box.classList.add('loaded');box.classList.remove('noimg');if(cr)cr.innerHTML=it.credit?(it.link?`<a href="${esc(it.link)}" target="_blank" rel="noopener">Ảnh: ${esc(it.credit)}</a>`:'Ảnh: '+esc(it.credit)):''};
 const load=(it,ok,fail)=>{const img=new Image();img.alt=imgTerm(w);img.decoding='async';img.referrerPolicy='no-referrer';let settled=false;const t=setTimeout(()=>{if(!settled){settled=true;fail()}},5000);img.onload=()=>{if(settled)return;settled=true;clearTimeout(t);img.naturalWidth>40?ok(img):fail()};img.onerror=()=>{if(settled)return;settled=true;clearTimeout(t);fail()};img.src=it.url};
 const tryBing=k=>{if(!box.isConnected)return;if(k>=list.length){fallback();return}const it=list[(start+k)%list.length];load(it,img=>show(img,it),()=>tryBing(k+1))};
 const fallback=async()=>{const ov=await openverseList(w);const step=k=>{if(k>=ov.length){box.classList.add('noimg');return}load(ov[k],img=>show(img,ov[k]),()=>step(k+1))};step(0)};
 if(sw){sw.hidden=list.length<2;sw.onclick=e=>{e.stopPropagation();const pk=lsGet(PICK_KEY);pk[key]=start+1;lsSet(PICK_KEY,pk);box.classList.remove('loaded');fillImage(box,w)}}
 tryBing(0);
}

function bindFlash(onPrev,onNext){

 card.addEventListener('touchend',e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?onNext():onPrev()}},{passive:true});

function ipaResume(u){
 const sounds=selectedIpaSounds(u);
 for(let si=0;si<sounds.length;si++)for(let wi=0;wi<sounds[si].words.length;wi++)if(!ipaLearned(u.id,sounds[si].sound,sounds[si].words[wi].word))return{s:si,w:wi,end:false};

}
function focusIpaView(){

 if(ipaFocus.route!==route||ipaFocus.u!==u.id){Object.assign(ipaFocus,{route,u:u.id},ipaResume(u))}

 const top=`<p class="eyebrow">BƯỚC 01 / 04 · PHÁT ÂM IPA</p><div class="focus-progress"><div><b>${st.pct}%</b> đã học · ${st.learned}/${st.total} từ</div><span>${done(u.id,0)?'✓ Bước đã hoàn thành':'Tự lưu tiến độ'}</span><i style="--p:${st.pct}%"></i></div>${chips}`;

const DESC_PER_UNIT=10,DESC_GOAL=3;
const baseBuildUnits=buildUnits;
buildUnits=function(){
 const list=baseBuildUnits(),used=new Set(list.flatMap(u=>u.words.map(w=>norm(w.keyword))));
 list.forEach((u,i)=>{for(const [keyword,ipa,category,taboo,vk,vt] of (DESC_EXTRA[i]||[])){if(u.words.length>=DESC_PER_UNIT)break;const k=norm(keyword);if(used.has(k))continue;used.add(k);u.words.push({keyword,ipa,category,taboo,vietnamese_keyword:vk,vietnamese_taboo:vt,extra:true})}u.descTheme=DESC_THEMES[i]||''});
 return list;
};
function descGoal(u){return Math.min(DESC_GOAL,u.words.length)}

function fmtDur(sec){sec=Math.round(sec||0);if(sec<60)return sec?'< 1 phút':'0 phút';const m=Math.round(sec/60),h=Math.floor(m/60);return h?`${h} giờ${m%60?' '+(m%60)+' phút':''}`:m+' phút'}
function dayDiff(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
function normScoresObj(v){return Array.isArray(v)?Object.fromEntries(v.map((x,i)=>[String(i),x])):(v||{})}
function stuStagePct(prog,u,s){
 const pr=prog?.[u.id]||prog?.[String(u.id)]||{};if(pr['stage'+s])return 100;
 try{
  if(s===0){const c=pr.ipaChecks||{},sounds=ipaFor(u),total=sounds.reduce((a,x)=>a+x.words.length,0),l=sounds.reduce((a,x)=>a+x.words.filter(w=>c[x.sound+':'+w.word]).length,0);return total?Math.round(l/total*100):0}
  if(s===1||s===2){const it=allExerciseItems(u,s===1?'translation':'listen'),sc=normScoresObj(pr[(s===1?'tr':'li')+'Scores']);const ok=it.filter(x=>Number(sc[x.id]??(s===1?sc[x.index]:(x.legacyListenIndex===undefined?0:sc[x.legacyListenIndex]))??0)>=80).length;return it.length?Math.round(ok/it.length*100):0}
  const c=pr.descDone||{},g=descGoal(u),d=u.words.filter((w,i)=>c[w.keyword]||c[i]).length;return g?Math.min(100,Math.round(d/g*100)):0;
 }catch{return 0}
}
function studentStats(s){
 const prog=s.progress||s.state?.progress||{},today=todayKey(),days={};let lastSeen=null;
 units.forEach(u=>{const pr=prog[u.id]||prog[String(u.id)]||{};Object.entries(pr.studyTime||{}).forEach(([d,v])=>days[d]=(days[d]||0)+Number(v||0));if(pr.lastSeen&&(!lastSeen||pr.lastSeen>lastSeen))lastSeen=pr.lastSeen});
 const unitPct=units.map(u=>[0,1,2,3].map(k=>stuStagePct(prog,u,k)));
 const coursePct=Math.round(unitPct.reduce((a,r)=>a+r.reduce((x,y)=>x+y,0)/4,0)/units.length);
 const stepsDone=unitPct.reduce((a,r)=>a+r.filter(x=>x===100).length,0);
 const curU=units.findIndex((u,i)=>unitPct[i].some(x=>x<100)),cu=curU<0?null:units[curU],cs=cu?unitPct[curU].findIndex(x=>x<100):-1;
 const last7=[...Array(7)].map((_,k)=>{const d=new Date();d.setDate(d.getDate()-6+k);const key=d.toLocaleDateString('en-CA');return{key,sec:days[key]||0,label:['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]}});
 const studyDays=Object.keys(days).filter(d=>days[d]>=60).sort(),lastDay=studyDays[studyDays.length-1]||(s.updatedAt?new Date(s.updatedAt).toLocaleDateString('en-CA'):null);
 const idle=lastDay?dayDiff(lastDay,today):null,hasTime=Object.keys(days).length>0;
 const level=!s.active?'off':idle===null?'never':idle>=5?'red':idle>=3?'amber':days[today]>=60?'good':'ok';
 return{prog,days,today:days[today]||0,week:last7.reduce((a,x)=>a+x.sec,0),total:Object.values(days).reduce((a,x)=>a+x,0),last7,unitPct,coursePct,stepsDone,cu,cs,curU,lastDay,lastSeen:lastSeen||s.updatedAt||null,idle,hasTime,level};
}
function warnText(st){return st.level==='off'?'Đã tạm ngưng':st.level==='never'?'Chưa học lần nào':st.level==='red'?`⚠ ${st.idle} ngày chưa học`:st.level==='amber'?`⚠ ${st.idle} ngày chưa học`:st.level==='good'?'✓ Hôm nay đã học':st.idle===0?'Hôm nay có vào học':st.idle===1?'Học gần nhất: hôm qua':`Học gần nhất: ${st.idle} ngày trước`}
function reminderText(s,st){
 const where=st.cu?`Bài ${st.cu.id+1} · ${stepNames[st.cs]}`:'đã xong toàn bộ khóa';
 return st.level==='never'?`Chào ${s.name}, Bob English nhắc em: tài khoản ${s.username} chưa bắt đầu học. Em đăng nhập và học Bài 1 nhé, mỗi ngày 25–35 phút là đủ!`
  :st.idle>=3?`Chào ${s.name}, Bob English nhắc em: em đã ${st.idle} ngày chưa vào học. Tiến độ hiện tại ${st.coursePct}%, đang ở ${where}. Em sắp xếp học lại mỗi ngày 25–35 phút nhé, cố lên!`
  :`Chào ${s.name}, tiến độ của em hiện là ${st.coursePct}% (${where}). 7 ngày qua em học ${fmtDur(st.week)}. Giữ nhịp mỗi ngày 25–35 phút nhé!`;
}

async function flushCloudSave(){clearTimeout(cloudTimer);if(!account||cloudConflict)return false;if(cloudBusy){await new Promise(resolve=>{const check=()=>cloudBusy?setTimeout(check,80):resolve();check()});return cloudPending?flushCloudSave():!cloudConflict}if(!cloudPending)return true;cloudBusy=true;cloudPending=false;syncMessage('Đang lưu bài làm…');try{const snapshot=JSON.stringify(state);const r=await api('/api/progress',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({state:JSON.parse(snapshot),revision:cloudRevision}),signal:AbortSignal.timeout(15000)});const result=await r.json();if(!r.ok){if(r.status===409){cloudConflict=true;syncMessage('Có thay đổi trên thiết bị khác. Xuất bản sao bài làm rồi tải lại để đồng bộ.',true);toast(result.error);return false}throw Error(result.error||'Chưa lưu được bài làm.')}cloudRevision=result.revision;try{localStorage.setItem(STORE,JSON.stringify({state,revision:cloudRevision,dirty:cloudPending}))}catch{}syncMessage('Đã lưu trực tuyến · Tiến độ riêng của '+account.name);return true}catch(e){cloudPending=true;syncMessage('Chưa lưu trực tuyến. Bài làm giữ trên thiết bị; sẽ thử lại khi có mạng.',true);return false}finally{cloudBusy=false;if(cloudPending&&!cloudConflict)cloudTimer=setTimeout(flushCloudSave,8000)}}

async function teacherPage(){if(!isTeacher()){go('home');return}layout(`${heading('Quản lý lớp học','Tạo tài khoản học viên, theo dõi tiến độ và cập nhật học liệu.','KHÔNG GIAN GIÁO VIÊN')}<div class="notice">Bạn tạo tài khoản, gửi tên đăng nhập và mật khẩu cho học viên. Học viên không cần email hay tài khoản ChatGPT. Kho học liệu gốc chỉ dành cho giáo viên.</div><div class="plan-grid"><section class="card"><h2>Tạo tài khoản học viên</h2><form id="enroll-form" class="teacher-form"><label class="field" for="student-name">Tên học viên</label><input id="student-name" maxlength="100" required autocomplete="off"><label class="field" for="student-username">Tên đăng nhập</label><input id="student-username" required pattern="[a-z0-9_.-]{3,32}" minlength="3" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Ví dụ: an01"><label class="field" for="student-password">Mật khẩu cấp cho học viên</label><input id="student-password" type="password" required minlength="3" maxlength="128" autocomplete="new-password"><label class="small"><input type="checkbox" id="student-show-password"> Hiện mật khẩu</label><button class="btn" type="submit">Tạo tài khoản</button><div id="enroll-result" aria-live="polite"></div></form></section><section class="card"><h2>Học liệu của giáo viên</h2><p>Xem toàn bộ bản gốc hoặc sửa câu, nghĩa và từ vựng theo bài. Học viên chỉ được nhận nội dung mở theo tiến độ.</p><button class="btn light" data-go="resources">Mở kho học liệu</button><button class="btn light mt" id="course-export">Xuất học liệu (.json)</button><label class="field" for="course-import">Cập nhật từ file học liệu đã sửa</label><input id="course-import" type="file" accept=".json,application/json"><p class="small">Giữ đủ cấu trúc 44 âm / 23 bài dịch để tránh lệch tiến độ. Hệ thống kiểm tra cấu trúc trước khi lưu.</p><div id="course-result" aria-live="polite"></div></section></div><section class="panel"><h2>Học viên & tiến độ riêng</h2><div id="student-list">Đa  const refresh=async()=>{try{const r=await api('/api/teacher',{cache:'no-store'}),result=await r.json();if(!r.ok)throw Error(result.error);$('#student-list').innerHTML=result.students.length?result.students.map((s,i)=>`<article class="student-row"><h3>${esc(s.name)}</h3><p>${esc(s.username)} · ${s.active?'Đang học':'Đã tạm ngưng'}</p><p>${s.steps}/56 bước · ${Math.round(s.steps/56*100)}% khóa học</p><div class="progress"><i style="width:${s.steps/56*100}%"></i></div><p class="small mt">Lần lưu gần nhất: ${s.updatedAt?new Date(s.updatedAt).toLocaleString('vi-VN'):'Chưa có bài làm'}</p><details><summary>Tiến độ từng bài</summary><div class="table-wrap"><table><thead><tr><th>Bài</th>${stepNames.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${units.map(u=>`<tr><td>${u.week}</td>${[0,1,2,3].map(n=>`<td>${s.progress[u.id]?.['stage'+n]?'✓':'—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details><div class="reset-password mt"><label class="field" for="reset-password-${i}">Mật khẩu mới (nếu cần đặt lại)</label><input type="password" id="reset-password-${i}" minlength="3" maxlength="128" autocomplete="new-password"><button class="btn light mt" data-reset-student="${i}">Đặt lại mật khẩu</button></div><button class="btn light mt" data-toggle-student="${i}">${s.active?'Tạm ngưng quyền học':'Mở lại quyền học'}</button></article>`).join(''):'<p class="mt">Chưa có học viên. Thêm tên, tài khoản và mật khẩu ở phía trên.</p>';root.querySelectorAll('[data-reset-student]').forEach(b=>b.onclick=async()=>{const i=Number(b.dataset.resetStudent),student=result.students[i],password=$('#reset-password-'+i).value;if(password.length<3){toast('Nhập mật khẩu mới từ 3 ký tự.');return}b.disabled=true;try{await teacherWrite({action:'resetPassword',id:student.id,password});$('#reset-password-'+i).value='';toast('Đã đặt lại mật khẩu. Phiên đăng nhập cũ đã kết thúc.')}catch(e){toast(e.message)}finally{b.disabled=false}});root.querySelectorAll('[data-toggle-student]').forEach(b=>b.onclick=async()=>{const s=result.students[Number(b.dataset.toggleStudent)];b.disabled=true;try{await teacherWrite({action:'active',id:s.id,active:!s.active});await refresh()}catch(e){toast(e.message);b.disabled=false}})}catch(e){$('#student-list').textContent=e.message}};
 $('#student-show-password').onchange=e=>$('#student-password').type=e.target.checked?'text':'password';$('#enroll-form').onsubmit=async e=>{e.preventDefault();const b=$('#enroll-form button');b.disabled=true;try{await teacherWrite({action:'create',username:$('#student-username').value,name:$('#student-name').value,password:$('#student-password').value});$('#enroll-result').textContent='Đã tạo tài khoản '+$('#student-username').value+'. Bạn gửi tài khoản và mật khẩu cho học viên.';$('#student-password').value='';await refresh();await renderTeacherDashboard()}catch(e){$('#enroll-result').textContent=e.message}finally{b.disabled=false}};
 $('#course-export').onclick=()=>downloadJson(data,'bob-hoc-lieu.json');$('#course-import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>3000000)throw Error('File quá lớn.');const content=JSON.parse(await f.text());if(!confirm('Cập nhật toàn bộ học liệu bằng file này? Bài làm hiện tại được giữ lại.'))return;await teacherWrite({action:'course',content});await loadCourse();$('#course-result').textContent='Đã cập nhật học liệu.'}catch(error){$('#course-result').textContent=error.message}};
 const fillEditor=()=>{const card=data.translations[Number($('#teacher-lesson').value)].cards[Number($('#teacher-card').value)];$('#edit-fields').innerHTML=[['vocab','Từ vựng & nghĩa'],['eng1','Câu tiếng Anh 1'],['vie1','Nghĩa tiếng Việt 1'],['eng2','Câu tiếng Anh 2'],['vie2','Nghĩa tiếng Việt 2']].map(([k,label])=>`<label class="field" for="edit-${k}">${label}</label><input id="edit-${k}" value="${esc(card[k])}">`).join('')};$('#teacher-lesson').onchange=fillEditor;$('#teacher-card').onchange=fillEditor;fillEditor();$('#save-card').onclick=async()=>{const b=$('#save-card');b.disabled=true;try{const next=JSON.parse(JSON.stringify(data)),card=next.translations[Number($('#teacher-lesson').value)].cards[Number($('#teacher-card').value)];const lesson=next.translations[Number($('#teacher-lesson').value)],old={...card};for(const k of ['vocab','eng1','vie1','eng2','vie2'])card[k]=$('#edit-'+k).value.trim();for(const [k,paragraph] of [['eng1','fullEng'],['eng2','fullEng'],['vie1','fullVie'],['vie2','fullVie']])if(old[k]!==card[k])lesson[paragraph]=lesson[paragraph].replace(old[k],card[k]);await teacherWrite({action:'course',content:next});await loadCourse();syncAssignmentSnapshot();$('#edit-result').textContent='Đã lưu câu và nghĩa mới.'}catch(e){$('#edit-result').textContent=e.message}finally{b.disabled=false}};await refresh();
}
async function teacherWrite(body){const r=await api('/api/teacher',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),result=await r.json();if(!r.ok)throw Error(result.error||'Chưa lưu được thay đổi.');return result}
function readToken(){try{return sessionStorage.getItem('bob_session_token')||''}catch{return ''}}
function storeToken(token){try{sessionStorage.setItem('bob_session_token',token)}catch{throw Error('Trình duyệt đang chặn lưu phiên đăng nhập. Hãy cho phép bộ nhớ của trang web.')}}
function apiBase(){const raw=String(window.BOB_CONFIG?.API_BASE_URL||'').trim().replace(/\/+$/,'');if(!raw)throw Error('Chưa điền địa chỉ máy chủ ở đầu file index.html.');const url=new URL(raw);if(url.protocol!=='https:'&&!(url.protocol==='http:'&&['localhost','127.0.0.1'].includes(url.hostname)))throw Error('Địa chỉ máy chủ phải dùng HTTPS.');if(url.username||url.password||url.search||url.hash||url.pathname!=='/')throw Error('Điền URL gốc của Worker, không thêm đường dẫn, tên đăng nhập hay mật khẩu.');return url.origin}
async function api(path,options={}){const headers=new Headers(options.headers||{}),token=readToken();if(token)headers.set('Authorization','Bearer '+token);const response=await fetch(apiBase()+path,{...options,headers,credentials:'omit'});return response}
function showLogin(message=''){account=null;data=null;cloudPending=false;cloudConflict=false;clearTimeout(cloudTimer);let configured=true;try{apiBase()}catch{configured=false}root.innerHTML=`<main class="entry login-entry"><section class="login-story"><a href="#home" class="brand"><span class="brandmark">b</span><span>bob english<small>LEARN WITH PURPOSE</small></span></a><p class="eyebrow">KHÔNG GIAN HỌC TẬP CỦA BẠN</p><h1>Mỗi ngày một chút.<br>Tự tin hơn rất nhiều.</h1><p>Phát âm rõ ràng, diễn đạt tự nhiên.<br>Học tiếng Anh theo nhịp của riêng bạn.</p><div class="login-sound" aria-hidden="true"><b>/iː/</b><span>Listen. Practice. Grow.<br>Một bước nhỏ, một tiến bộ mới.</span></div><small>BOB ENGLISH · YOUR DAILY GROWTH</small></section><section class="login-form-panel"><p class="eyebrow">CHÀO MỪNG BẠN TRỞ LẠI</p><h2>Đăng nhập lớp học</h2><p>Tiếp tục bài học và lưu lại tiến bộ của bạn.</p>${!configured?'<div class="notice warn">Chưa cấu hình địa chỉ máy chủ. Vui lòng liên hệ giáo viên.</div>':''}<form id="login-form" class="teacher-form"><label class="field" for="login-username">Tên đăng nhập</label><input id="login-username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required maxlength="32" placeholder="Tên đăng nhập của bạn"><label class="field" for="login-password">Mật khẩu</label><input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Nhập mật khẩu"><label class="password-toggle"><input type="checkbox" id="login-show-password"> Hiện mật khẩu</label><button class="btn" id="login-submit" ${configured?'':'disabled'}>Vào lớp học ${icon('arrow')}</button><p id="login-error" class="login-error" role="status" aria-live="polite">${esc(message)}</p></form><p class="login-help">Dùng tài khoản giáo viên đã cấp. Quên mật khẩu? Liên hệ giáo viên để được hỗ trợ.</p><small class="build-label">BOB ENGLISH · UI 2026.11.02 · Nghe đầy đủ</small></section></main>`;$('#login-show-password').onchange=e=>$('#login-password').type=e.target.checked?'text':'password';$('#login-form').onsubmit=async e=>{e.preventDefault();const button=$('#login-submit'),error=$('#login-error');button.disabled=true;error.textContent='Đang đăng nhập…';try{const r=await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#login-username').value.trim().toLowerCase(),password:$('#login-password').value}),signal:AbortSignal.timeout(20000)});const result=await r.json();if(!r.ok)throw Error(result.error);storeToken(result.token);await bootstrap()}catch(errorValue){if(error.isConnected)error.textContent=errorValue.message==='Failed to fetch'?'Chưa kết nối được máy chủ. Kiểm tra mạng và cấu hình API.':errorValue.message}finally{if(button.isConnected)button.disabled=false}}}
async function logout(){if(account&&cloudPending){const saved=await flushCloudSave();if(!saved&&!confirm('Bài làm chưa lưu trực tuyến. Tiếp tục đăng xuất? Bản nháp vẫn nằm trên thiết bị.'))return}try{await api('/api/logout',{method:'POST'})}catch{}try{sessionStorage.removeItem('bob_session_token')}catch{}state=null;account=null;cloudRevision=0;window.bobRecovery=null;location.hash='';showLogin('Đã đăng xuất.')}
